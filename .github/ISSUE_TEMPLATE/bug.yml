name: Defecto
description: Algo no se comporta como debería
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Área probable
      options: ["A · Economía y guardado", "B · Casino y UI", "C · Arte, mundo y QA", "No sé"]
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: "1. ...\n2. ..."
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations: { required: true }
  - type: textarea
    id: observado
    attributes:
      label: Resultado observado
      description: Incluye el texto exacto del log o una captura de la app.
    validations: { required: true }
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: "macOS/Windows, Unity 6000.0.84f1, commit o rama"
